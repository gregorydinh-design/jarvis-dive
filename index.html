<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07141f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jarvis Dive">
  <title>Jarvis Dive</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>JARVIS <span>DIVE</span></h1>
      <p class="sub">Bühlmann ZHL-16C · GF · OC multi-gaz</p>
    </div>
    <span id="offline" class="pill" hidden>Hors ligne</span>
  </header>

  <main>
    <section class="card" aria-labelledby="h-plan">
      <h2 id="h-plan">Plongée</h2>
      <div class="grid2">
        <label>Profondeur <span class="unit">m</span>
          <input id="depth" type="number" inputmode="decimal" min="1" max="150" step="1" value="40">
        </label>
        <label>Temps fond <span class="unit">min, descente incluse</span>
          <input id="bottomTime" type="number" inputmode="decimal" min="1" max="300" step="1" value="20">
        </label>
        <label>GF bas <span class="unit">%</span>
          <input id="gfLow" type="number" inputmode="numeric" min="5" max="100" step="5" value="85">
        </label>
        <label>GF haut <span class="unit">%</span>
          <input id="gfHigh" type="number" inputmode="numeric" min="5" max="100" step="5" value="85">
        </label>
      </div>

      <h3>Gaz</h3>
      <div id="gases" class="gases"></div>
      <button id="addGas" class="ghost" type="button">+ Gaz de déco</button>

      <details class="advanced">
        <summary>Réglages avancés</summary>
        <div class="grid2">
          <label>Descente <span class="unit">m/min</span><input id="descentRate" type="number" inputmode="decimal" value="18"></label>
          <label>Remontée <span class="unit">m/min</span><input id="ascentRate" type="number" inputmode="decimal" value="9"></label>
          <label>Dernier palier
            <select id="lastStop"><option value="3" selected>3 m</option><option value="6">6 m</option></select>
          </label>
          <label>Arrêt au switch <span class="unit">min</span><input id="switchStopMin" type="number" inputmode="numeric" min="0" value="1"></label>
          <label>ppO2 max fond <span class="unit">bar</span><input id="ppO2Bottom" type="number" inputmode="decimal" step="0.1" value="1.4"></label>
          <label>Eau
            <select id="waterDensity"><option value="1.03" selected>Mer</option><option value="1.0">Douce</option></select>
          </label>
          <label>SAC fond <span class="unit">L/min</span><input id="sacBottom" type="number" inputmode="decimal" value="20"></label>
          <label>SAC déco <span class="unit">L/min</span><input id="sacDeco" type="number" inputmode="decimal" value="15"></label>
        </div>
      </details>
    </section>

    <section id="result" class="card" aria-live="polite"></section>
  </main>

  <footer>
    Outil d'aide à la planification en cours de validation. Il ne remplace ni la formation,
    ni l'ordinateur de plongée, ni le jugement du plongeur. Vérifiez chaque plan avec un second outil.
  </footer>

  <template id="gasRow">
    <div class="gas">
      <span class="gas-role"></span>
      <input class="gas-mix" type="text" autocapitalize="characters" spellcheck="false" aria-label="Mélange">
      <label class="gas-switch">switch
        <input class="gas-depth" type="number" inputmode="numeric" min="0" step="1" aria-label="Profondeur de switch">
        <span class="unit">m</span>
      </label>
      <button class="gas-del ghost" type="button" aria-label="Supprimer">✕</button>
    </div>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
